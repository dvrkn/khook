apiVersion: khook.dvrkn.com/v1
kind: Khook
metadata:
  name: local-demo

defaults:
  timeout: 5m

steps:
  - name: create-namespace
    apply:
      manifests:
        - inline: |
            apiVersion: v1
            kind: Namespace
            metadata:
              name: ${NAMESPACE_NAME_TO_CREATE}

  - name: ingress-nginx
    needs: [create-namespace]
    helm:
      chart: ingress-nginx
      repo: https://kubernetes.github.io/ingress-nginx
      version: 4.8.3
      namespace: ${NAMESPACE_NAME_FOR_INGRESS}
      createNamespace: true
      values:
        controller:
          service:
            type: ClusterIP
