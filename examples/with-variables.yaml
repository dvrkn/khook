# yaml-language-server: $schema=../schema/v1/khook.json
apiVersion: khook.io/v1
kind: Khook
metadata:
  name: variables-demo

# Variables come from env vars prefixed with KHOOK_VAR_ (configurable via
# --var-prefix; KHOOK_SECRET_ additionally redacts the value from output), or
# from CLI --set / --var-file. Precedence: --set > --var-file > secret env >
# prefixed env. ${VAR:-default} falls back when the variable is unset, and
# values can be piped through sprig functions helm-style:
# ${APP_NAME | lower | trunc 63}. Example:
#   KHOOK_VAR_APP_NAME=my-app KHOOK_VAR_NAMESPACE=production \
#     khook apply -f examples/with-variables.yaml
#
# Steps can be conditional: when: holds a CEL expression over the same
# variables (as the map `vars`); false skips the step. See docs/dsl.md.

defaults:
  timeout: 5m

steps:
  - name: create-app-namespace
    apply:
      manifests:
        - inline: |
            apiVersion: v1
            kind: Namespace
            metadata:
              name: ${NAMESPACE}
              labels:
                app: ${APP_NAME | lower | trunc 63}

  - name: deploy-application
    needs: [create-app-namespace]
    apply:
      namespace: ${NAMESPACE}
      manifests:
        - inline: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: ${APP_NAME}
              namespace: ${NAMESPACE}
            spec:
              replicas: ${REPLICAS:-2}
              selector:
                matchLabels:
                  app: ${APP_NAME}
              template:
                metadata:
                  labels:
                    app: ${APP_NAME}
                spec:
                  containers:
                  - name: app
                    image: nginx:1.25
                    ports:
                    - containerPort: 80
        - inline: |
            apiVersion: v1
            kind: Service
            metadata:
              name: ${APP_NAME}-service
              namespace: ${NAMESPACE}
            spec:
              selector:
                app: ${APP_NAME}
              ports:
              - port: 80
                targetPort: 80

  # Only runs with --set EXPOSE_INGRESS=true (or KHOOK_VAR_EXPOSE_INGRESS=true);
  # otherwise reported skipped. deploy-application runs either way — a step
  # excluded by when: still satisfies needs.
  - name: expose-ingress
    when: vars.get("EXPOSE_INGRESS", "false") == "true"
    needs: [deploy-application]
    apply:
      namespace: ${NAMESPACE}
      manifests:
        - inline: |
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: ${APP_NAME}
              namespace: ${NAMESPACE}
            spec:
              rules:
                - http:
                    paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: ${APP_NAME}-service
                            port:
                              number: 80
