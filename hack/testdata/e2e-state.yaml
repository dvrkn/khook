# E2E coverage for the run-state record (state:): a three-step chain gated on
# a ConfigMap the e2e creates out-of-band between runs, so run 1 fails at
# step-b, and run 2 — the *identical* spec, hence a matching hash — resumes:
# step-a skips from the record, step-b's wait now succeeds, step-c runs.
# MARKER is substituted into step-a's manifest so the e2e can force a hash
# mismatch (full re-run) by changing it.
apiVersion: khook.io/v1
kind: Khook
metadata:
  name: e2e-state
state:
  namespace: ${STATE_NS}
defaults:
  timeout: 60s
steps:
  - name: step-a
    apply:
      namespace: ${STATE_NS}
      createNamespace: true
      manifests:
        - inline: |
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: state-marker
            data:
              made-by: ${MARKER:-khook}

  - name: step-b
    needs: [step-a]
    timeout: 15s
    wait:
      on: configmaps
      namespace: ${STATE_NS}
      selector: khook-e2e=state-gate
      for: jsonpath={.data.ready}=yes

  - name: step-c
    needs: [step-b]
    apply:
      namespace: ${STATE_NS}
      manifests:
        - inline: |
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: state-final
            data:
              done: "yes"
