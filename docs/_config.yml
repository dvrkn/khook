# Jekyll config for the khook website (GitHub Pages: main branch, /docs folder).
# Local preview:  cd docs && bundle install && bundle exec jekyll serve

title: khook
tagline: Declarative bootstrap for Kubernetes
description: >-
  khook is a single static binary that takes a freshly created Kubernetes
  cluster from "API server answers" to "workloads can be deployed" — a
  declarative, idempotent DAG of helm, apply, wait, and friends. No kubectl,
  no helm binary, no bash.
url: "https://khook.io"
baseurl: ""
lang: en

repo_url: https://github.com/dvrkn/khook

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-optional-front-matter

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
